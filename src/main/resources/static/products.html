<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products - E-Comm Admin</title>

  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="style.css">
  <style>
    .hidden-body { display: none; }
    /* Table specific styles */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; color: #333; }
    .product-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }

    .btn-edit { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
    .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn-add { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body id="mainBody" >

<div class="dashboard-container">
  <aside class="sidebar">
    <h2>E-Com Admin</h2>
    <nav>
      <ul>
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="products.html" class="active">Manage Products</a></li>
        <li><a href="orders.html">View Orders</a></li>
        <hr style="border: 0.5px solid #444; margin: 10px 0;">
        <li><a href="index.html">Go to Store</a></li>
        <li><a href="#" onclick="logout()" style="color: #ff7675;">Logout</a></li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
      <h1>Product Inventory</h1>
      <button class="btn-add" onclick="window.location.href='add-product.html'">+ Add New Product</button>
    </div>

    <section class="table-container">
      <table>
        <thead>
        <tr>
          <th>Image</th>
          <th>Product Name</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody id="productList">
        </tbody>
      </table>
    </section>
  </main>
</div>

<script src="app.js"></script>
<script>
  window.onload = function() {
    checkAuth();    // Security check
    loadProducts(); // Load table data
  };
</script>
</body>
</html>
