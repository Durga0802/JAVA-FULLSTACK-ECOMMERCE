<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | E-Com</title>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Dashboard Layout Styling */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h3 {
            color: #7f8c8d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .card p {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
    </style>
</head>
<body id="mainBody"> <div class="dashboard-container">
    <aside class="sidebar">
        <h2>E-Com Admin</h2>
        <nav>
            <ul>
                <li><a href="admin-dashboard.html" class="active">Dashboard</a></li>
                <li><a href="products.html">Manage Products</a></li>
                <li><a href="orders.html">View Orders</a></li>
                <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
                <li><a href="index.html">Go to Store</a></li>
                <li><a href="#" onclick="logout()" style="color: #ff7675; font-weight: bold;">Logout</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Dashboard Overview</h1>
            <div class="user-info" style="font-weight: 600; color: #3498db;">Welcome, Admin</div>
        </header>

        <div class="stats-grid">
            <div class="card" style="border-top: 4px solid #3498db;">
                <h3>Total Inventory Items</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="card" style="border-top: 4px solid #e67e22;">
                <h3>Active Orders</h3>
                <p id="totalOrders">0</p>
            </div>

            <div class="card" style="border-top: 4px solid #2ecc71;">
                <h3>Total Revenue</h3>
                <p id="totalSales">₹0</p>
            </div>
        </div>

        <div style="margin-top: 40px; padding: 20px; background: #ebf5fb; border-radius: 8px; color: #2980b9;">
            <strong>Quick Actions:</strong>
            <button onclick="location.href='add-product.html'" style="margin-left: 15px; padding: 8px 15px; cursor: pointer;">+ Add New Product</button>
        </div>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
